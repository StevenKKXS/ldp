_target_: diffusion_policy.workspace.train_encoder_pretrain_workspace.TrainEncoderPretrainWorkspace
# SECTION APPLICABLE for all transformers
obs_encoder_dir: obs_encoders/tool_hang_encoder.ckpt
obs_encoder_freeze: false
global_horizon: 32
global_obs: 16
global_action: 8
subsample_frames: 1
subsampling_method: uniform
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 10
    mode: max
    monitor_key: test_mean_score
dataloader:
  batch_size: 16
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: true
dataset_obs_steps: ${global_obs}
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0
exp_name: default
horizon: ${global_horizon}
keypoint_visible_rate: 1.0
logging:
  group: null
  id: null
  mode: disabled
