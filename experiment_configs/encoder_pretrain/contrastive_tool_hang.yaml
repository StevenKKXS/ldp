      robot0_eef_quat:
        shape:
        - 4
      robot0_eye_in_hand_image:
        shape:
        - 3
        - 240
        - 240
        type: rgb
      robot0_gripper_qpos:
        shape:
        - 2
      sideview_image:
        shape:
        - 3
        - 240
        - 240
        type: rgb
  time_as_cond: true
